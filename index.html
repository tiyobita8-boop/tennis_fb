<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>伸びちゃん 無限ラリー練習 v2</title><style>*{box-sizing:border-box}body{margin:0;background:#101d2b;color:#eef7ff;font-family:system-ui,sans-serif}main{max-width:1150px;margin:auto;padding:16px}h1{font-size:1.5rem}p{color:#bdd2e0}.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,1fr);gap:16px}@media(max-width:760px){.layout{grid-template-columns:1fr}}canvas{width:100%;height:auto;display:block;background:#16664d;border-radius:16px;touch-action:none;cursor:grab}.panel{background:#1c3042;padding:16px;border-radius:16px}select,button{width:100%;padding:10px;margin:5px 0 12px;border-radius:9px;border:0;font-size:15px}button{background:#67dbb4;color:#08291d;font-weight:700;cursor:pointer}.secondary{background:#d5e4f3;color:#172b3e}.stats{display:flex;justify-content:space-between;gap:8px}.stats b{font-size:1.6rem;color:#8bffce}label{font-weight:700;display:block;margin-top:7px}small{color:#c2d3de}#status{min-height:40px}.hint{font-size:13px;color:#c4dce7;margin-bottom:10px}.controlrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.controlrow button{font-size:13px}hr{border:0;border-top:1px solid #476071;margin:16px 0}.tag{display:inline-block;padding:4px 9px;background:#304e61;border-radius:9px;font-size:12px;margin-bottom:8px}</style></head><body><main><h1>🎾 伸びちゃんの無限ラリー練習 v2</h1><p>フォア・バックの打点を描き分け！ ストレート／クロスを切替。伸びちゃんも相手もドラッグで自由に移動できます。</p><div class="layout"><div><canvas id="court" width="600" height="780" aria-label="テニスコート。青い伸びちゃんとオレンジの相手をドラッグで移動"></canvas><p class="hint">👆 青＝伸びちゃん／オレンジ＝相手。人物をドラッグ（スマホは指で移動）。ラリー中も移動できます。</p></div><div class="panel"><div class="stats"><div>ラリー回数<br><b id="count">0</b></div><div>現在の球種<br><strong id="current">—</strong></div></div><hr><label for="side">打ち方（右利き）</label><select id="side"><option value="fore">フォアハンド（体の右側）</option><option value="back">バックハンド（体の左側）</option></select><label for="shot">伸びちゃんの持ち球</label><select id="shot"></select><div id="info" class="hint"></div><label for="route">ラリー方向</label><select id="route"><option value="straight">ストレートラリー</option><option value="cross">クロスラリー</option><option value="free">自由方向（現在の立ち位置同士）</option></select><div class="controlrow"><button id="forePos" class="secondary">フォアクロス配置</button><button id="backPos" class="secondary">バッククロス配置</button></div><div class="controlrow"><button id="centerPos" class="secondary">中央配置</button><button id="resetPos" class="secondary">配置をリセット</button></div><button id="start">▶ ラリー開始 / 最初から</button><button id="next" class="secondary">次の返球で選択球を打つ</button><button id="pause" class="secondary">一時停止 / 再開</button><label for="tempo">アニメーション速度</label><input id="tempo" type="range" min="0.5" max="2" step="0.1" value="1" style="width:100%"><p id="status">開始すると、伸びちゃんが最初に打ちます。</p><span class="tag">位置は固定・手動移動可</span><span class="tag">無限ラリー</span><br><small>左右の打点と球筋は上から見た練習用の模式図です。右利きの伸びちゃんは画面右でフォア、左でバック。相手も右利き想定で、向かい合うため左右が逆になります。ドラッグ中は打球の着地点も更新されます。</small></div></div></main><script>
const shots={fore:[['守りノスライス',1.05,.27,0],['軟式の高速フラット',1.9,.08,0],['刀の素振りの高速フラット',2,.07,0],['スピンのムーンボール',.75,.85,0],['ややはやいフラットドライブ',1.5,.3,0],['ふんわりろぶ',.65,.98,0],['戸村式パッタンフラット',1.6,.1,0],['股関節のたたみ',1.4,.22,0],['ハヤメスピン',1.65,.55,0]],back:[['両手白石守りフラット',1.05,.2,0],['両手丹田コンパクト',1.3,.2,0],['ジャックナイフ超高速フラット',2.2,.1,0],['フラット両手高速フラット',1.95,.09,0],['両手ふんわりロブのフラット',.65,.95,0],['両手スピンのムーンボール',.75,.85,0],['片手純スライス',1.1,.15,0],['片手左に曲がるスライス',1.1,.16,-1],['片手右に曲がるスライス',1.1,.16,1]]};
const $=id=>document.getElementById(id),c=$('court'),ctx=c.getContext('2d'),side=$('side'),sel=$('shot'),route=$('route');let active=false,paused=false,phase=0,t=0,count=0,shot=shots.fore[0],last=performance.now(),drag=null;const me={x:420,y:640},op={x:180,y:140};
function choose(){shot=shots[side.value][+sel.value];$('info').textContent=`球速 ${shot[1]>=1.8?'超高速':shot[1]>=1.4?'速い':shot[1]<=.8?'ゆっくり':'標準'} ／ 弾道 ${shot[2]>.7?'高い':shot[2]<.2?'低い':'中程度'} ／ 曲がり ${shot[3]<0?'左':shot[3]>0?'右':'なし'}`;}
function refresh(){sel.innerHTML='';shots[side.value].forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s[0];sel.append(o)});choose()}side.onchange=refresh;sel.onchange=choose;refresh();
function position(mode){if(mode==='fore'){me.x=420;op.x=180;route.value='cross';side.value='fore'}else if(mode==='back'){me.x=180;op.x=420;route.value='cross';side.value='back'}else if(mode==='center'){me.x=300;op.x=300;route.value='straight'}else{me.x=420;op.x=180;route.value='cross';side.value='fore'}me.y=640;op.y=140;refresh();$('status').textContent='配置を変更しました。人物をドラッグして微調整できます。'}
$('forePos').onclick=()=>position('fore');$('backPos').onclick=()=>position('back');$('centerPos').onclick=()=>position('center');$('resetPos').onclick=()=>position('reset');
$('start').onclick=()=>{active=true;paused=false;phase=0;t=0;count=0;$('count').textContent='0';$('current').textContent=shot[0];$('status').textContent='伸びちゃんが '+shot[0]+'！'};
$('pause').onclick=()=>{if(!active)return;paused=!paused;$('status').textContent=paused?'一時停止中':'ラリー再開'};
$('next').onclick=()=>{choose();$('status').textContent='次の伸びちゃんの打球から選択ショットを反映します。'};
route.onchange=()=>{$('status').textContent=route.value==='cross'?'クロスラリーに変更しました':route.value==='straight'?'ストレートラリーに変更しました':'自由方向に変更しました'};
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}function targetFor(from,to){let x=to.x;if(route.value==='cross')x=600-from.x;else if(route.value==='straight')x=from.x;return {x:clamp(x,85,515),y:to.y}}
function contact(person,isMe,hand){let offset=(hand==='fore'?1:-1)*(isMe?1:-1)*35;return{x:person.x+offset,y:person.y+(isMe?-8:8)}}
function player(p,name,color,isMe){const x=p.x,y=p.y,hand=isMe?side.value:(phase===1?'fore':'back'),offset=(hand==='fore'?1:-1)*(isMe?1:-1);ctx.save();ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y-23,13,0,Math.PI*2);ctx.fill();ctx.fillRect(x-13,y-8,26,30);ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x-9,y+20);ctx.lineTo(x-17,y+36);ctx.moveTo(x+9,y+20);ctx.lineTo(x+17,y+36);ctx.stroke();const swing=(active&&!paused&&((isMe&&phase===0)||(!isMe&&phase===1)))?Math.sin(Math.min(t*3,1)*Math.PI)*12:0;ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x+offset*10,y);ctx.lineTo(x+offset*25,y-6+swing);ctx.moveTo(x-offset*10,y);ctx.lineTo(x-offset*17,y+12);ctx.stroke();ctx.strokeStyle='#f6e9be';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x+offset*25,y-6+swing);ctx.lineTo(x+offset*36,y-8+swing);ctx.ellipse(x+offset*46,y-9+swing,12,20,offset*.22,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillText(name,x,y-49);ctx.restore()}
function draw(){ctx.clearRect(0,0,600,780);ctx.fillStyle='#1e7459';ctx.fillRect(15,12,570,756);ctx.fillStyle='#266ba6';ctx.fillRect(70,90,460,600);ctx.strokeStyle='white';ctx.lineWidth=4;ctx.strokeRect(70,90,460,600);ctx.beginPath();ctx.moveTo(70,390);ctx.lineTo(530,390);ctx.moveTo(125,90);ctx.lineTo(125,690);ctx.moveTo(475,90);ctx.lineTo(475,690);ctx.moveTo(125,270);ctx.lineTo(475,270);ctx.moveTo(125,510);ctx.lineTo(475,510);ctx.moveTo(300,270);ctx.lineTo(300,510);ctx.stroke();ctx.strokeStyle='#e8f0f5';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(65,390);ctx.lineTo(535,390);ctx.stroke();player(op,'相手','#ff9c6b',false);player(me,'伸びちゃん','#83d8ff',true);
if(active){const from=phase===0?me:op,to=phase===0?op:me,hand=phase===0?side.value:'fore',start=contact(from,phase===0,hand),aim=targetFor(from,to),end=contact({x:aim.x,y:aim.y},phase!==0,phase===0?'fore':side.value),p=t;let x=start.x+(end.x-start.x)*p,y=start.y+(end.y-start.y)*p;const curve=phase===0?shot[3]:0;x+=curve*70*Math.sin(Math.PI*p);const arc=phase===0?shot[2]:.38;y-=arc*120*Math.sin(Math.PI*p);const scale=phase===0?1-.4*p:.6+.4*p;ctx.fillStyle='#e8f94d';ctx.beginPath();ctx.arc(x,y,11*scale,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#c3d323';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.moveTo(aim.x-9,aim.y);ctx.lineTo(aim.x+9,aim.y);ctx.moveTo(aim.x,aim.y-9);ctx.lineTo(aim.x,aim.y+9);ctx.stroke();} }
function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;if(active&&!paused){const duration=phase===0?1.9/shot[1]:1.35;t+=dt*Number($('tempo').value)/duration;if(t>=1){t=0;phase=1-phase;count++;$('count').textContent=count;$('current').textContent=phase===1?shot[0]:'相手の返球';$('status').textContent=phase===1?'相手が自動で返球します':'伸びちゃんの '+shot[0]}}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
function pointerPos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}c.addEventListener('pointerdown',e=>{const p=pointerPos(e);const candidates=[me,op].filter(o=>Math.hypot(p.x-o.x,p.y-o.y)<62);if(!candidates.length)return;drag=candidates.sort((a,b)=>Math.hypot(p.x-a.x,p.y-a.y)-Math.hypot(p.x-b.x,p.y-b.y))[0];c.setPointerCapture(e.pointerId);c.style.cursor='grabbing';e.preventDefault()});c.addEventListener('pointermove',e=>{if(!drag)return;const p=pointerPos(e);drag.x=clamp(p.x,90,510);drag.y=clamp(p.y,drag===me?445:100,drag===me?660:335)});function release(){drag=null;c.style.cursor='grab'}c.addEventListener('pointerup',release);c.addEventListener('pointercancel',release);
</script></body></html>
